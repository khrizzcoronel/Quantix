openapi: 3.0.3
info:
  title: Quantix - API de Control de Caja, Arqueos y Auditoría (Módulo 006)
  version: 1.0.0
  description: Endpoints para sesiones de caja, arqueo ciego, movimientos manuales de efectivo, cortes fiscales X y Z, auditoría y métricas de desempeño.

paths:
  /api/v1/caja/abrir:
    post:
      summary: Apertura de turno de caja e inicio de sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id, monto_inicial_efectivo, sucursal_id]
              properties:
                terminal_id:
                  type: string
                monto_inicial_efectivo:
                  type: number
                  minimum: 0
                sucursal_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Sesión de caja abierta

  /api/v1/caja/sesion-activa:
    get:
      summary: Obtener la sesión activa del usuario autenticado
      responses:
        '200':
          description: Datos de la sesión activa
        '404':
          description: No hay sesión abierta

  /api/v1/caja/arqueo-ciego:
    post:
      summary: Declaración física ciega y cierre de turno de caja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sesion_id, total_fisico_declarado]
              properties:
                sesion_id:
                  type: string
                  format: uuid
                total_fisico_declarado:
                  type: number
                desglose_declarado_json:
                  type: object
                observaciones:
                  type: string
      responses:
        '200':
          description: Arqueo procesado con cálculo de descuadre y cierre de turno

  /api/v1/caja/movimientos:
    get:
      summary: Listar movimientos extraordinarios de la sesión activa
      parameters:
        - name: sesion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de movimientos
    post:
      summary: Registrar ingreso o egreso de gaveta justificado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, monto, concepto]
              properties:
                tipo:
                  type: string
                  enum: [INGRESO, EGRESO]
                monto:
                  type: number
                  exclusiveMinimum: 0
                concepto:
                  type: string
                sesion_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Movimiento registrado
        '400':
          description: Fondos insuficientes en gaveta para egreso

  /api/v1/caja/corte-x:
    get:
      summary: Generar Corte X (arqueo provisional del turno activo sin cierre)
      parameters:
        - name: sesion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumen provisional del turno

  /api/v1/caja/sesiones/{sesion_id}/corte-z:
    get:
      summary: Generar Corte Z fiscal consolidado de fin de turno
      parameters:
        - name: sesion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comprobante fiscal de cierre Z

  /api/v1/caja/estadisticas-historicas:
    get:
      summary: Métricas de desempeño histórico y precisión de gaveta por cajero
      parameters:
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: KPIs de cajeros

  /api/v1/caja/mi-actividad:
    get:
      summary: Resumen diario y actividad del operador en turno
      responses:
        '200':
          description: Datos de actividad del cajero autenticado
