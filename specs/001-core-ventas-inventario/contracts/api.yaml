openapi: 3.0.3
info:
  title: Quantix - API de Ventas e Inventario (Módulo 001)
  version: 1.0.0
  description: Endpoints operativos para búsqueda en POS, checkout con descarga FEFO y gestión de lotes.
paths:
  /api/v1/pos/buscar-producto:
    get:
      summary: Buscar producto por código de barras o nombre
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Código de barras, SKU o nombre del producto
      responses:
        '200':
          description: Lista de productos coincidentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'

  /api/v1/pos/checkout:
    post:
      summary: Procesar venta con asignación automática FEFO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Venta completada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaResponse'
        '400':
          description: Sesión, cupón o pago inválido
        '402':
          description: Pago electrónico rechazado por el simulador
        '409':
          description: Conflicto de stock insuficiente
        '504':
          description: Tiempo de espera agotado en el simulador de pagos

  /api/v1/inventario/lotes:
    post:
      summary: Registrar entrada de lote con fecha de vencimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoteCreateRequest'
      responses:
        '201':
          description: Lote registrado exitosamente

components:
  schemas:
    ProductoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo_barras:
          type: string
        sku:
          type: string
        nombre:
          type: string
        tipo_estrategico:
          type: string
          enum: [GANCHO, NICHO, REGULAR]
        precio_venta:
          type: number
          format: double
        stock_total_disponible:
          type: integer

    CheckoutItem:
      type: object
      required:
        - producto_id
        - cantidad
      properties:
        producto_id:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1

    CheckoutRequest:
      type: object
      required:
        - sesion_caja_id
        - items
      properties:
        sesion_caja_id:
          type: string
          format: uuid
        cliente_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
        pagos:
          type: array
          items:
            $ref: '#/components/schemas/PagoCheckout'
        metodo_pago:
          type: string
          description: Compatibilidad para un pago simple cuando no se envía `pagos`.
        codigo_cupon:
          type: string
          nullable: true
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 64

    PagoCheckout:
      type: object
      required: [metodo_pago, monto]
      properties:
        metodo_pago:
          type: string
          enum: [EFECTIVO, TARJETA, TRANSFERENCIA, QR, CUPON]
        monto:
          type: number
          exclusiveMinimum: 0
        referencia_pasarela:
          type: string
          nullable: true
          description: Token de escenario del simulador para pagos electrónicos.

    VentaResponse:
      type: object
      properties:
        venta_id:
          type: string
          format: uuid
        folio_ticket:
          type: string
        subtotal:
          type: number
        total_descuento:
          type: number
        total_impuestos:
          type: number
        total_pagar:
          type: number
        estado:
          type: string
        mensaje:
          type: string

    LoteCreateRequest:
      type: object
      required:
        - producto_id
        - numero_lote
        - fecha_vencimiento
        - costo_unitario_compra
        - cantidad_inicial
      properties:
        producto_id:
          type: string
          format: uuid
        numero_lote:
          type: string
        fecha_vencimiento:
          type: string
          format: date
        costo_unitario_compra:
          type: number
        cantidad_inicial:
          type: integer
          minimum: 1
