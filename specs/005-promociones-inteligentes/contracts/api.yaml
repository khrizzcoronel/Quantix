openapi: 3.0.3
info:
  title: Quantix - API de Promociones Inteligentes (Módulo 005)
  version: 1.0.0
  description: Endpoints para gestión de reglas de combos, volumen y monto mínimo, y motor evaluador en tiempo real para el POS.

paths:
  /api/v1/promociones/:
    get:
      summary: Listar reglas de promoción configuradas
      parameters:
        - name: activo_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Lista de promociones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReglaPromocionResponse'
    post:
      summary: Crear nueva regla de promoción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReglaPromocionCreateRequest'
      responses:
        '201':
          description: Regla creada exitosamente

  /api/v1/promociones/{regla_id}:
    put:
      summary: Actualizar regla de promoción
      parameters:
        - name: regla_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReglaPromocionCreateRequest'
      responses:
        '200':
          description: Regla actualizada
    delete:
      summary: Desactivar regla de promoción (baja lógica)
      parameters:
        - name: regla_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Regla desactivada

  /api/v1/promociones/evaluar-carrito:
    post:
      summary: Evaluar reglas aplicables al carrito y simular descuentos con protección de margen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluarCarritoRequest'
      responses:
        '200':
          description: Resultado de evaluación de descuentos y promociones aplicadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluarCarritoResponse'

components:
  schemas:
    ReglaPromocionCreateRequest:
      type: object
      required:
        - nombre
        - tipo_regla
        - descuento_tipo
        - descuento_valor
      properties:
        nombre:
          type: string
        tipo_regla:
          type: string
          enum: [COMBO, VOLUMEN, MONTO_MINIMO]
        producto_disparador_id:
          type: string
          format: uuid
          nullable: true
        producto_beneficio_id:
          type: string
          format: uuid
          nullable: true
        categoria_id:
          type: string
          format: uuid
          nullable: true
        cantidad_minima:
          type: number
          default: 1.0
        monto_minimo:
          type: number
          default: 0.0
        descuento_tipo:
          type: string
          enum: [PORCENTAJE, MONTO_FIJO]
        descuento_valor:
          type: number
        activo:
          type: boolean
          default: true

    ReglaPromocionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo_regla:
          type: string
        descuento_tipo:
          type: string
        descuento_valor:
          type: number
        cantidad_minima:
          type: number
        monto_minimo:
          type: number
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time

    ItemCarritoParaEvaluar:
      type: object
      required: [producto_id, cantidad, precio_unitario]
      properties:
        producto_id:
          type: string
          format: uuid
        categoria_id:
          type: string
          format: uuid
          nullable: true
        cantidad:
          type: number
        precio_unitario:
          type: number

    EvaluarCarritoRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarritoParaEvaluar'

    EvaluarCarritoResponse:
      type: object
      properties:
        descuento_total:
          type: number
        subtotal_bruto:
          type: number
        total_con_descuento:
          type: number
        promociones_aplicadas:
          type: array
          items:
            type: object
            properties:
              regla_id:
                type: string
                format: uuid
              nombre_regla:
                type: string
              tipo_regla:
                type: string
              descuento_aplicado:
                type: number
        margen_respetado:
          type: boolean
