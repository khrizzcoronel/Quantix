openapi: 3.0.3
info:
  title: Quantix - API de Pronóstico de Demanda y Reorden (Módulo 004)
  version: 1.0.0
  description: Endpoints para cálculo de sugerencias de compra operativas, inferencia estadística Z/t y estacionalidad.

paths:
  /api/v1/inventario/ordenes-compra/sugerencias:
    get:
      summary: Sugerencias automáticas de reorden según velocidad de venta y lead time
      parameters:
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de artículos en riesgo de rotura de stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SugerenciaReordenResponse'

  /api/v1/reportes/analisis/proyecciones:
    get:
      summary: Inferencia estadística de demanda e intervalos de confianza 95% (Z / Student-t)
      parameters:
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Proyecciones estadísticas por producto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProyeccionDemandaResponse'

  /api/v1/reportes/analisis/estacionalidad:
    get:
      summary: Mapa de calor de estacionalidad por día de la semana y franja horaria (7x24)
      parameters:
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matriz horaria/semanal de afluencia y volumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstacionalidadResponse'

components:
  schemas:
    SugerenciaReordenResponse:
      type: object
      properties:
        producto_id:
          type: string
          format: uuid
        sku:
          type: string
        producto_nombre:
          type: string
        clasificacion_abc:
          type: string
          enum: [A, B, C]
        proveedor_id:
          type: string
          format: uuid
          nullable: true
        proveedor_nombre:
          type: string
          nullable: true
        stock_actual:
          type: number
        punto_reorden:
          type: number
        sugerencia_compra:
          type: number
        motivo:
          type: string

    ProyeccionDemandaResponse:
      type: object
      properties:
        producto_id:
          type: string
          format: uuid
        sku:
          type: string
        nombre:
          type: string
        n_muestras:
          type: integer
        distribucion_usada:
          type: string
          enum: [NORMAL_Z, STUDENT_T]
        demanda_media_diaria:
          type: number
        desviacion_estandar:
          type: number
        limite_inferior_95:
          type: number
        limite_superior_95:
          type: number
        stock_preventivo_sugerido:
          type: number
        estado_riesgo:
          type: string
          enum: [OPTIMO, ALERTA_REPOSICION, RIESGO_QUIEBRE]

    EstacionalidadCelda:
      type: object
      properties:
        dia_semana:
          type: integer
          description: 0=Domingo, 1=Lunes, ..., 6=Sábado
        dia_nombre:
          type: string
        hora:
          type: integer
          description: 8 a 22
        transacciones:
          type: integer
        total_ingresos:
          type: number

    EstacionalidadResponse:
      type: object
      properties:
        celdas:
          type: array
          items:
            $ref: '#/components/schemas/EstacionalidadCelda'
        pico_dia:
          type: string
        pico_hora:
          type: integer
