openapi: 3.0.3
info:
  title: Quantix - API de CRM, Clientes y Fidelización (Módulo 002)
  version: 1.0.0
  description: Endpoints para captura rápida de clientes en POS, historial de compras, gestión de puntos de lealtad y validación territorial de cupones.

paths:
  /api/v1/crm/clientes/buscar/{identificador}:
    get:
      summary: Buscar cliente por cédula o teléfono en menos de 200 ms
      parameters:
        - name: identificador
          in: path
          required: true
          schema:
            type: string
          description: Cédula de identidad o número de teléfono
      responses:
        '200':
          description: Cliente encontrado con saldo de puntos y datos de sucursal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: Cliente no encontrado

  /api/v1/crm/clientes:
    get:
      summary: Listar clientes con aislamiento multi-sucursal
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: activo_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Lista de clientes autorizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponse'
    post:
      summary: Alta rápida de cliente desde POS o módulo CRM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreateRequest'
      responses:
        '201':
          description: Cliente creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '409':
          description: Cédula o teléfono ya registrados

  /api/v1/crm/clientes/{cliente_id}/historial:
    get:
      summary: Historial de los últimos 50 tickets del cliente
      parameters:
        - name: cliente_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteTicketHistorial'

  /api/v1/crm/cupones:
    get:
      summary: Listar cupones de la sucursal activa
      parameters:
        - name: sucursal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado de cupones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuponResponse'
    post:
      summary: Emisión de cupón asociado a cliente y sede
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuponCreateRequest'
      responses:
        '201':
          description: Cupón emitido

  /api/v1/crm/cupones/validar:
    post:
      summary: Validación territorial y vigencia de cupón antes de pagar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, sucursal_id, total_venta]
              properties:
                codigo:
                  type: string
                sucursal_id:
                  type: string
                  format: uuid
                total_venta:
                  type: number
      responses:
        '200':
          description: Cupón válido y descuento calculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuponValidacionResponse'
        '400':
          description: Cupón expirado, ya canjeado o de otra sucursal

components:
  schemas:
    ClienteCreateRequest:
      type: object
      required:
        - cedula
        - telefono
        - nombre
        - sucursal_id
      properties:
        cedula:
          type: string
          example: "1712345678"
        telefono:
          type: string
          example: "0991234567"
        nombre:
          type: string
          example: "María García"
        email:
          type: string
          format: email
          nullable: true
        sucursal_id:
          type: string
          format: uuid

    ClienteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cedula:
          type: string
        telefono:
          type: string
        nombre:
          type: string
        email:
          type: string
          nullable: true
        puntos_acumulados:
          type: integer
        sucursal_id:
          type: string
          format: uuid
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time

    ClienteTicketHistorial:
      type: object
      properties:
        id:
          type: string
          format: uuid
        folio_ticket:
          type: string
        fecha_hora:
          type: string
          format: date-time
        total_pagar:
          type: number
        estado:
          type: string

    CuponCreateRequest:
      type: object
      required:
        - codigo
        - cliente_id
        - sucursal_id
        - tipo
        - descuento_tipo
        - descuento_valor
        - valido_desde
        - valido_hasta
      properties:
        codigo:
          type: string
        cliente_id:
          type: string
          format: uuid
        sucursal_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [CUMPLEANIOS, REACTIVACION, COMBO, MANUAL]
        descuento_tipo:
          type: string
          enum: [PORCENTAJE, MONTO_FIJO]
        descuento_valor:
          type: number
        valido_desde:
          type: string
          format: date
        valido_hasta:
          type: string
          format: date

    CuponResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        cliente_nombre:
          type: string
        sucursal_id:
          type: string
          format: uuid
        tipo:
          type: string
        descuento_tipo:
          type: string
        descuento_valor:
          type: number
        valido_desde:
          type: string
          format: date
        valido_hasta:
          type: string
          format: date
        estado:
          type: string
          enum: [EMITIDO, CANJEADO, EXPIRADO]

    CuponValidacionResponse:
      type: object
      properties:
        valido:
          type: boolean
        cupon_id:
          type: string
          format: uuid
        descuento_calculado:
          type: number
        mensaje:
          type: string
