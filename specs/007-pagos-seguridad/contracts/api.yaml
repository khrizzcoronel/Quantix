openapi: 3.0.3
info:
  title: Quantix - API de Pagos Simulados (Módulo 007)
  version: 2.0.0
  description: Contrato implementado para seguimiento y conciliación de intentos de pago simulados.
paths:
  /api/v1/pagos/intentos/{checkout_key}:
    get:
      summary: Consultar los intentos asociados a un checkout idempotente
      parameters:
        - name: checkout_key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Intentos visibles para el operador autenticado o para supervisión
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IntentoPago'}
        '401': {description: JWT ausente o inválido}
  /api/v1/pagos/intentos/{intento_id}/conciliar:
    post:
      summary: Resolver manualmente un intento INICIADO o INCIERTO
      parameters:
        - name: intento_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultado]
              properties:
                resultado: {type: string, enum: [APROBADO, RECHAZADO]}
                detalle: {type: string, nullable: true}
      responses:
        '200':
          description: Intento conciliado y evento de auditoría creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntentoPago'}
        '403': {description: Requiere rol SUPERVISOR o DIRECTOR}
        '409': {description: El intento ya tiene un estado definitivo}
components:
  schemas:
    IntentoPago:
      type: object
      properties:
        id: {type: string, format: uuid}
        checkout_idempotency_key: {type: string}
        indice: {type: integer}
        usuario_id: {type: string, format: uuid}
        sesion_caja_id: {type: string, format: uuid}
        venta_id: {type: string, format: uuid, nullable: true}
        metodo_pago: {type: string}
        monto: {type: number}
        estado: {type: string, enum: [INICIADO, APROBADO, RECHAZADO, INCIERTO, VINCULADO]}
        referencia_pasarela: {type: string, nullable: true}
        codigo_respuesta: {type: string, nullable: true}
        detalle: {type: string, nullable: true}
        creado_en: {type: string, format: date-time}
        actualizado_en: {type: string, format: date-time}
