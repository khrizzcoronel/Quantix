openapi: 3.0.3
info:
  title: Quantix - API de Gestión Multi-Sucursal y Terminales (Módulo 013)
  version: 1.0.0
  description: Endpoints para administración de sucursales físicas y terminales de caja asociadas.

paths:
  /api/v1/sucursales/:
    get:
      summary: Listar todas las sucursales activas
      responses:
        '200':
          description: Listado de sucursales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SucursalResponse'
    post:
      summary: Crear nueva sucursal (Solo Director)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SucursalCreateRequest'
      responses:
        '201':
          description: Sucursal creada
        '403':
          description: Requiere rol DIRECTOR

  /api/v1/sucursales/{sucursal_id}:
    get:
      summary: Obtener datos de una sucursal específica
      parameters:
        - name: sucursal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de la sucursal
        '403':
          description: Acceso denegado fuera del scope del usuario
        '404':
          description: Sucursal no encontrada

  /api/v1/sucursales/{sucursal_id}/terminales:
    get:
      summary: Listar terminales de caja asociadas a la sucursal
      parameters:
        - name: sucursal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Terminales de la sede
    post:
      summary: Registrar nueva terminal en la sucursal
      parameters:
        - name: sucursal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre]
              properties:
                codigo:
                  type: string
                nombre:
                  type: string
      responses:
        '201':
          description: Terminal registrada

components:
  schemas:
    SucursalCreateRequest:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
        nombre:
          type: string
        direccion:
          type: string
        ciudad:
          type: string
        telefono:
          type: string
        es_matriz:
          type: boolean
          default: false

    SucursalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        direccion:
          type: string
        ciudad:
          type: string
        telefono:
          type: string
        activo:
          type: boolean
        es_matriz:
          type: boolean
